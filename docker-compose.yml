# T-Pot Sensor Deployer
#
# The stack is self-contained: code, Terraform, Redis and all state (SQLite DB, Terraform state, logs)
# live in the image / named volumes. The only host paths mounted are inputs:
#   TPOT_HOST_DIR  the T-Pot Hive install the deployer registers sensors into (read/write)
#   SECRETS_HOST_DIR  optional read-only dir holding gcp-sa.json and ssh_key.pub
# Access is through T-Pot's own nginx (set up by tpot-expansion-pack.sh) or directly on WEB_BIND:WEB_PORT.

x-deployer: &deployer
  build:
    context: .
  image: tpot-sensor-deployer:latest
  restart: unless-stopped
  # Run as the user that owns the T-Pot directory so Hive files stay writable.
  user: "${PUID:-1000}:${PGID:-1000}"
  # Group that can write T-Pot's nginx config dir (see `stat -c %g $TPOT_HOST_DIR`).
  group_add:
    - "${TPOT_GID:-2000}"
  env_file:
    - .env
  # Fixed in-container paths; set here (not in .env) so a stale .env can never override them.
  environment:
    DATA_DIR: /data
    TPOT_DIR: /tpot
    SECRETS_DIR: /secrets
    REDIS_URL: redis://redis:6379/0
    GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
  volumes:
    - deployer_data:/data
    - ${TPOT_HOST_DIR:?Set TPOT_HOST_DIR in .env}:/tpot
    - ${SECRETS_HOST_DIR:-./secrets}:/secrets:ro
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    <<: *deployer
    container_name: tpot-deployer-web
    ports:
      # Docker bridge IP (docker0): T-Pot's nginx runs on its own Docker network and proxies
      # /sensors/ here; 127.0.0.1 would be the nginx container itself. Not reachable off-host.
      - "${WEB_BIND:-172.17.0.1}:${WEB_PORT:-8880}:8880"
      # Standalone (no T-Pot nginx in front): swap the line above for this one to publish the web
      # app on every host IP at http://<host>:WEB_PORT/. The app has NO login of its own - T-Pot's
      # nginx is what asks for a password - so anyone who can reach this port can create and
      # destroy cloud machines on your account. Only use it behind a firewall that limits the
      # port to you, and don't run tpot-expansion-pack.sh (it resets WEB_BIND to the bridge IP).
      # - "0.0.0.0:${WEB_PORT:-8880}:8880"

  worker:
    <<: *deployer
    container_name: tpot-deployer-worker
    command: ["python3", "worker.py"]

volumes:
  deployer_data:
  redis_data:
