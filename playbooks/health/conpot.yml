---
# conpot health check. Run against the relocated admin SSH port (-e ansible_port=64295).
- name: Check T-Pot conpot sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    honeypot_containers: [conpot_default]
    honeypot_ports: [80, 102, 502, 44818]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/health_base.yml
