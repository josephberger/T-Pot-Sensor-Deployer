---
# redishoneypot health check. Run against the relocated admin SSH port (-e ansible_port=64295).
- name: Check T-Pot redishoneypot sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    honeypot_containers: [redishoneypot]
    honeypot_ports: [6379]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/health_base.yml
