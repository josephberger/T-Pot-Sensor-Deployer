---
# multi_sensor health check. Run against the relocated admin SSH port (-e ansible_port=64295).
- name: Check T-Pot multi_sensor sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    honeypot_containers: [cowrie, dionaea, elasticpot, mailoney]
    honeypot_ports: [22, 23, 20, 21, 42, 81, 135, 445, 1433, 1723, 1883, 3306, 27017, 9200, 25, 587]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/health_base.yml
