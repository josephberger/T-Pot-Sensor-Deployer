---
# sentrypeer health check. Run against the relocated admin SSH port (-e ansible_port=64295).
- name: Check T-Pot sentrypeer sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    honeypot_containers: [sentrypeer]
    honeypot_ports: [5060]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/health_base.yml
