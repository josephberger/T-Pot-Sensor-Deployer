---
# Mailoney: SMTP honeypot.
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/mailoney.yml -e @vars.json
- name: Deploy T-Pot mailoney sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: mailoney
    honeypot_dirs:
      - /data/mailoney/log
    honeypot_networks: [mailoney_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/mailoney/log/commands.log, type: Mailoney }
    logstash_filter: |
      if [type] == "Mailoney" {
        date {
          match => [ "timestamp", "ISO8601" ]
        }
        mutate {
          add_field => { "dest_port" => "25" }
        }
      }
    honeypot_services: |
      mailoney:
        container_name: mailoney
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        environment:
        - HPFEEDS_SERVER=
        - HPFEEDS_IDENT=user
        - HPFEEDS_SECRET=pass
        - HPFEEDS_PORT=20000
        - HPFEEDS_CHANNELPREFIX=prefix
        networks:
        - mailoney_local
        ports:
        - '25:25'
        - '587:25'
        image: {{ tpot_repo }}/mailoney:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/mailoney/log:/opt/mailoney/logs
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
