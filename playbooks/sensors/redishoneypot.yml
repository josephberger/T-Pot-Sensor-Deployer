---
# Redishoneypot: Redis honeypot.
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/redishoneypot.yml -e @vars.json
- name: Deploy T-Pot redishoneypot sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: redishoneypot
    honeypot_dirs:
      - /data/redishoneypot/log
    honeypot_networks: [redishoneypot_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/redishoneypot/log/redishoneypot.log, type: Redishoneypot }
    logstash_filter: |
      if [type] == "Redishoneypot" {
        date {
          match => [ "time", "yyyy-MM-dd HH:mm:ss" ]
          remove_field => ["time"]
          remove_field => ["timestamp"]
        }
        mutate {
          split => { "addr" => ":" }
          add_field => {
            "src_ip" => "%{[addr][0]}"
            "src_port" => "%{[addr][1]}"
            "dest_port" => "6379"
            "dest_ip" => "${MY_EXTIP}"
          }
          remove_field => ["addr"]
        }
      }
    honeypot_services: |
      redishoneypot:
        container_name: redishoneypot
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        networks:
        - redishoneypot_local
        ports:
        - 6379:6379
        image: {{ tpot_repo }}/redishoneypot:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/redishoneypot/log:/var/log/redishoneypot
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
