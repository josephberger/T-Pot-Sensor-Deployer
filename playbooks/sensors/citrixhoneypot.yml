---
# CitrixHoneypot: Citrix ADC / NetScaler (CVE-2019-19781) honeypot.
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/citrixhoneypot.yml -e @vars.json
- name: Deploy T-Pot citrixhoneypot sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: citrixhoneypot
    honeypot_dirs:
      - /data/citrixhoneypot/log
    honeypot_networks: [citrixhoneypot_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/citrixhoneypot/log/server.log, type: CitrixHoneypot }
    logstash_filter: |
      if [type] == "CitrixHoneypot" {
        grok {
          match => {
            "message" => [ "\A\(%{IPV4:src_ip:string}:%{INT:src_port:integer}\): %{JAVAMETHOD:http.http_method:string}%{SPACE}%{CISCO_REASON:fileinfo.state:string}: %{UNIXPATH:fileinfo.filename:string}",
                     "\A\(%{IPV4:src_ip:string}:%{INT:src_port:integer}\): %{JAVAMETHOD:http.http_method:string}%{SPACE}%{CISCO_REASON:fileinfo.state:string}: %{GREEDYDATA:payload:string}",
               "\A\(%{IPV4:src_ip:string}:%{INT:src_port:integer}\): %{S3_REQUEST_LINE:msg:string} %{CISCO_REASON:fileinfo.state:string}: %{GREEDYDATA:payload:string:string}",
               "\A\(%{IPV4:src_ip:string}:%{INT:src_port:integer}\): %{GREEDYDATA:msg:string}" ]
          }
        }
        date {
          match => [ "asctime", "ISO8601" ]
          remove_field => ["asctime"]
          remove_field => ["message"]
        }
        mutate {
          add_field => {
            "dest_port" => "443"
          }
          rename => {
            "levelname" => "level"
          }
        }
      }
    honeypot_services: |
      citrixhoneypot:
        container_name: citrixhoneypot
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        networks:
        - citrixhoneypot_local
        ports:
        - 443:443
        image: {{ tpot_repo }}/citrixhoneypot:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/citrixhoneypot/log:/opt/citrixhoneypot/logs
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
