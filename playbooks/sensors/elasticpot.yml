---
# ElasticPot: Elasticsearch honeypot.
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/elasticpot.yml -e @vars.json
- name: Deploy T-Pot elasticpot sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: elasticpot
    honeypot_dirs:
      - /data/elasticpot/log
    honeypot_networks: [elasticpot_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/elasticpot/log/elasticpot.json, type: ElasticPot }
    logstash_filter: |
      if [type] == "ElasticPot" {
        date {
          match => [ "timestamp", "ISO8601" ]
        }
        mutate {
          rename => {
            "content_type" => "http.http_content_type"
            "dst_port" => "dest_port"
            "dst_ip" => "dest_ip"
            "message" => "event_type"
            "request" => "request_method"
            "user_agent" => "http_user_agent"
      "url" => "http.url"
          }
        }
      }
    honeypot_services: |
      elasticpot:
        container_name: elasticpot
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        networks:
        - elasticpot_local
        ports:
        - 9200:9200
        image: {{ tpot_repo }}/elasticpot:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/elasticpot/log:/opt/elasticpot/log
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
