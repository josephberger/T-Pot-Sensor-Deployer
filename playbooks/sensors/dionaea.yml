---
# Dionaea: malware-collecting network services (SMB, FTP, MSSQL, MySQL, ...).
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/dionaea.yml -e @vars.json
- name: Deploy T-Pot dionaea sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: dionaea
    honeypot_dirs:
      - /data/dionaea
      - /data/dionaea/binaries
      - /data/dionaea/log
      - /data/dionaea/roots/ftp
      - /data/dionaea/roots/tftp
      - /data/dionaea/roots/upnp
      - /data/dionaea/roots/www
      - /data/dionaea/rtp
    honeypot_networks: [dionaea_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/dionaea/log/dionaea.json, type: Dionaea }
    logstash_filter: |
      if [type] == "Dionaea" {
        date {
          match => [ "timestamp", "ISO8601" ]
        }
        mutate {
          rename => {
            "dst_port" => "dest_port"
            "dst_ip" => "dest_ip"
          }
          gsub => [
            "src_ip", "::ffff:", "",
            "dest_ip", "::ffff:", ""
          ]
        }
        if [credentials] {
          mutate {
            add_field => {
              "username" => "%{[credentials][username]}"
              "password" => "%{[credentials][password]}"
            }
            remove_field => "[credentials]"
          }
        }
      }
    honeypot_services: |
      dionaea:
        container_name: dionaea
        stdin_open: true
        tty: true
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        networks:
        - dionaea_local
        ports:
        - '20:20'
        - '21:21'
        - '42:42'
        - 69:69/udp
        - 81:81
        - 135:135
        - 445:445
        - 1433:1433
        - 1723:1723
        - 1883:1883
        - 3306:3306
        - 27017:27017
        image: {{ tpot_repo }}/dionaea:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/dionaea/roots/ftp:/opt/dionaea/var/dionaea/roots/ftp
        - /data/dionaea/roots/tftp:/opt/dionaea/var/dionaea/roots/tftp
        - /data/dionaea/roots/www:/opt/dionaea/var/dionaea/roots/www
        - /data/dionaea/roots/upnp:/opt/dionaea/var/dionaea/roots/upnp
        - /data/dionaea:/opt/dionaea/var/dionaea
        - /data/dionaea/binaries:/opt/dionaea/var/dionaea/binaries
        - /data/dionaea/log:/opt/dionaea/var/log
        - /data/dionaea/rtp:/opt/dionaea/var/dionaea/rtp
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
