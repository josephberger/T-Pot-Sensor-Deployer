---
# Ciscoasa: Cisco ASA (CVE-2018-0101) honeypot.
# Generated from T-Pot's compose/tpot_services.yml and docker/elk/logstash/dist/http_output.conf (T-Pot 24.04).
# Usage (normally invoked by the deployer):
#   ansible-playbook -i IP, playbooks/sensors/ciscoasa.yml -e @vars.json
- name: Deploy T-Pot ciscoasa sensor
  hosts: all
  become: true
  vars_files: [../defaults.yml]
  vars:
    sensor_type: ciscoasa
    honeypot_dirs:
      - /data/ciscoasa/log
    honeypot_networks: [ciscoasa_local]
    # This sensor's slice of T-Pot's log pipeline.
    logstash_inputs:
      - { path: /data/ciscoasa/log/ciscoasa.log, type: Ciscoasa, codec: plain }
    logstash_filter: |
      if [type] == "Ciscoasa" {
        kv {
          remove_char_key => " '{}"
          remove_char_value => "'{}"
          value_split => ":"
          field_split => ","
        }
        date {
          match => [ "timestamp", "ISO8601" ]
        }
        mutate {
          add_field => {
            "dest_ip" => "${MY_EXTIP}"
          }
        }
      }
    honeypot_services: |
      ciscoasa:
        container_name: ciscoasa
        restart: always
        depends_on:
          tpotinit:
            condition: service_healthy
        tmpfs:
        - /tmp/ciscoasa:uid=2000,gid=2000
        networks:
        - ciscoasa_local
        ports:
        - 5000:5000/udp
        - 8443:8443
        image: {{ tpot_repo }}/ciscoasa:{{ tpot_version }}
        pull_policy: always
        read_only: true
        volumes:
        - /data/ciscoasa/log:/var/log/ciscoasa
  tasks:
    - ansible.builtin.import_tasks: ../tasks/sensor_base.yml
