# ==============================================================================
# T-Pot Sensor Deployer - Route Snippet for T-Pot Nginx (Port 64297)
# Place inside /etc/nginx/conf.d/tpotweb.conf or include in server block
# ==============================================================================

    # 1. Unauthenticated Palo Alto EDL Endpoint (Bypasses auth_basic for firewalls)
    location /edl/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8880/edl/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 2. Sensor Deployer Web Dashboard & API (Requires T-Pot Basic Auth)
    location /sensors/ {
        auth_basic           "closed site";
        auth_basic_user_file /etc/nginx/nginxpasswd;

        proxy_pass http://127.0.0.1:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for live SSE deployment logs
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
