# ==============================================================================
# T-Pot Sensor Deployer - Route Snippet for T-Pot Nginx (Port 64297)
#
# Applied by ./tpot-expansion-pack.sh, which inserts these blocks into the server block of a copy of
# T-Pot's stock tpotweb.conf and mounts that copy into the nginx container. Don't paste this into
# the running container by hand: it is read-only and rebuilt on every T-Pot start.
#
# T-Pot's nginx runs on its own Docker network, so 127.0.0.1 there is the nginx container itself.
# It reaches the deployer through the host's Docker bridge address (docker0, usually 172.17.0.1),
# which is where WEB_BIND publishes the web container. The script rewrites the address below to
# the real bridge IP and WEB_PORT.
# ==============================================================================

    # 1. Palo Alto EDL endpoint (no login, so a firewall can poll it)
    # T-Pot's server block has "satisfy any; allow 127.0.0.1; deny all;", so turning auth_basic
    # off alone still denies everyone else. Each address that may fetch the EDL needs an allow
    # line; the script generates them from EDL_ALLOW in .env in place of the EDL_ALLOW line below.
    location /edl/ {
        auth_basic off;
        # allow <firewall-ip>;   # EDL_ALLOW
        proxy_pass http://172.17.0.1:8880/edl/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 2. Sensor Deployer Web Dashboard & API (Requires T-Pot Basic Auth)
    location /sensors/ {
        auth_basic           "closed site";
        auth_basic_user_file /etc/nginx/nginxpasswd;

        proxy_pass http://172.17.0.1:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for live SSE deployment logs
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
